# Dev profile — safe to use locally, must NOT be active in production

# Dev-only JWT secret — never deploy this value to production
caseflow.jwt.secret=dev-only-jwt-secret-for-local-use-not-for-production-32ch

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.com.caseflow=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger fully open in dev
springdoc.swagger-ui.disable-swagger-default-url=false

# Relax password policy if needed for seed users
caseflow.dev.seed-data=true
