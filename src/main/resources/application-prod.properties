# ── Production profile overrides ──────────────────────────────────────────────
# All sensitive values MUST be set via environment variables — no defaults here.

# ── Swagger / OpenAPI — disabled in production ────────────────────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Actuator — restrict endpoints in production ───────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.health.probes.enabled=true

# ── JPA — never show SQL in production ───────────────────────────────────────
spring.jpa.show-sql=false

# ── Logging — production-appropriate levels ───────────────────────────────────
logging.level.com.caseflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ── Connection pool tuning ────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${CASEFLOW_DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${CASEFLOW_DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${CASEFLOW_DB_POOL_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${CASEFLOW_DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${CASEFLOW_DB_POOL_MAX_LIFETIME_MS:1800000}

# ── Embedded Tomcat thread tuning ─────────────────────────────────────────────
server.tomcat.threads.max=${CASEFLOW_TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${CASEFLOW_TOMCAT_MIN_SPARE_THREADS:20}
server.tomcat.accept-count=${CASEFLOW_TOMCAT_ACCEPT_COUNT:100}
