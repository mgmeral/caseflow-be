spring.application.name=caseflow

# ── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── PostgreSQL ────────────────────────────────────────────────────────────────
# Override SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD for containerized runs
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/caseflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:caseflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:caseflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── MongoDB ───────────────────────────────────────────────────────────────────
# Override SPRING_DATA_MONGODB_URI for containerized runs
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/caseflow}
# Create indexes declared via @Indexed / @CompoundIndex on startup
spring.data.mongodb.auto-index-creation=true

# ── Springdoc / Swagger ───────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:when-authorized}
# Enable dedicated /actuator/health/liveness and /actuator/health/readiness for Kubernetes probes
management.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED:false}
# Disable Spring Boot's default MailHealthIndicator — CaseFlow uses per-mailbox SMTP, not a global sender
management.health.mail.enabled=false

# ── Storage ───────────────────────────────────────────────────────────────────
# Override CASEFLOW_STORAGE_ROOT_PATH for containerized runs (e.g. /app/storage-data)
caseflow.storage.root-path=${CASEFLOW_STORAGE_ROOT_PATH:./storage-data}
# provider: 'local' (default) or 'minio'
caseflow.storage.provider=${CASEFLOW_STORAGE_PROVIDER:local}
# MinIO connection (used when provider=minio)
caseflow.storage.minio.endpoint=${CASEFLOW_MINIO_ENDPOINT:http://localhost:9000}
caseflow.storage.minio.access-key=${CASEFLOW_MINIO_ACCESS_KEY:minioadmin}
caseflow.storage.minio.secret-key=${CASEFLOW_MINIO_SECRET_KEY:minioadmin}
caseflow.storage.minio.bucket=${CASEFLOW_MINIO_BUCKET:caseflow}

# ── CORS ──────────────────────────────────────────────────────────────────────
caseflow.cors.allowed-origins=${CASEFLOW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8090}

# ── JWT ───────────────────────────────────────────────────────────────────────
# REQUIRED — set via CASEFLOW_JWT_SECRET env var; app refuses to start if blank or default
caseflow.jwt.secret=${CASEFLOW_JWT_SECRET:}
caseflow.jwt.access-token-expiration-ms=${CASEFLOW_JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
caseflow.jwt.refresh-token-expiration-ms=${CASEFLOW_JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

# ── File Upload ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# ── SMTP (outbound email) ──────────────────────────────────────────────────
# Set CASEFLOW_SMTP_ENABLED=true and configure the rest to enable outbound email
caseflow.smtp.enabled=${CASEFLOW_SMTP_ENABLED:false}
spring.mail.host=${CASEFLOW_SMTP_HOST:localhost}
spring.mail.port=${CASEFLOW_SMTP_PORT:587}
spring.mail.username=${CASEFLOW_SMTP_USERNAME:}
spring.mail.password=${CASEFLOW_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${CASEFLOW_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${CASEFLOW_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ── Email ingress scheduling ───────────────────────────────────────────────
caseflow.email.ingress.retry-interval-ms=${CASEFLOW_EMAIL_INGRESS_RETRY_INTERVAL_MS:30000}
caseflow.email.ingress.max-attempts=${CASEFLOW_EMAIL_INGRESS_MAX_ATTEMPTS:5}

# ── Email outbound dispatch scheduling ────────────────────────────────────
caseflow.email.dispatch.retry-interval-ms=${CASEFLOW_EMAIL_DISPATCH_RETRY_INTERVAL_MS:60000}
caseflow.email.dispatch.max-attempts=${CASEFLOW_EMAIL_DISPATCH_MAX_ATTEMPTS:3}

# ── AI Service (sync REST lane) ───────────────────────────────────────────────
# Base URL of the caseflow-ai-service (no trailing slash)
caseflow.ai.service.base-url=${CASEFLOW_AI_SERVICE_BASE_URL:http://localhost:8081}
# Whether AI assist endpoints are active at all
caseflow.ai.service.enabled=${CASEFLOW_AI_SERVICE_ENABLED:true}
# Connect timeout for AI service HTTP calls (ms)
caseflow.ai.service.timeout.connect-ms=${CASEFLOW_AI_CONNECT_TIMEOUT_MS:6000}
# Read timeout for AI service HTTP calls (ms)
caseflow.ai.service.timeout.read-ms=${CASEFLOW_AI_READ_TIMEOUT_MS:180000}
# Max retries on retryable AI errors (5xx, network)
caseflow.ai.service.retry.max-attempts=${CASEFLOW_AI_RETRY_MAX_ATTEMPTS:1}
# Backoff between retries (ms)
caseflow.ai.service.retry.backoff-ms=${CASEFLOW_AI_RETRY_BACKOFF_MS:500}

# ── AI Async (Kafka event publishing lane) ────────────────────────────────────
# Disable Spring Boot's Kafka autoconfiguration — CaseFlow manages its own conditional
# Kafka producer factory in AiAsyncConfig. This ensures the app starts safely even
# when no Kafka broker is available or spring.kafka.* properties are not set.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Set to true only when Kafka is configured and running — app boots safely when false
caseflow.ai.async.enabled=${CASEFLOW_AI_ASYNC_ENABLED:false}
# Kafka bootstrap servers (required when async.enabled=true)
caseflow.ai.async.kafka.bootstrap-servers=${CASEFLOW_AI_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Topic names
caseflow.ai.async.kafka.topic.ticket-sync=ticket-ai-sync-requested
caseflow.ai.async.kafka.topic.policy-ingest=policy-ai-ingest-requested
caseflow.ai.async.kafka.topic.template-ingest=template-ai-ingest-requested

# ── Resilience4j — AI service circuit breaker ────────────────────────────────
# Opens after 50% failure rate over a 10-call sliding window; waits 30s before half-open
resilience4j.circuitbreaker.instances.ai-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ai-service.sliding-window-size=${CASEFLOW_AI_CB_WINDOW_SIZE:10}
resilience4j.circuitbreaker.instances.ai-service.failure-rate-threshold=${CASEFLOW_AI_CB_FAILURE_RATE:50}
resilience4j.circuitbreaker.instances.ai-service.wait-duration-in-open-state=${CASEFLOW_AI_CB_WAIT_DURATION:30s}
resilience4j.circuitbreaker.instances.ai-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.ai-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ai-service.record-exceptions=com.caseflow.ai.client.AiServiceUnavailableException

# ── Connection pool (Hikari) ─────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=${CASEFLOW_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${CASEFLOW_DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${CASEFLOW_DB_POOL_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${CASEFLOW_DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${CASEFLOW_DB_POOL_MAX_LIFETIME_MS:1800000}

# ── Embedded Tomcat ───────────────────────────────────────────────────────────
server.tomcat.threads.max=${CASEFLOW_TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=${CASEFLOW_TOMCAT_MIN_SPARE_THREADS:10}
server.tomcat.accept-count=${CASEFLOW_TOMCAT_ACCEPT_COUNT:50}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.caseflow=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss.SSS} [%X{correlationId:-}] [%thread] %-5level %logger{36} - %msg%n
